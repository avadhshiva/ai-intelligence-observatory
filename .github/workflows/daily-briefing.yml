name: Daily Briefing

on:
  schedule:
    # 06:00 IST = 00:30 UTC (IST is UTC+5:30)
    - cron: "45 9 * * *"
  workflow_dispatch:

jobs:
  daily-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
      USE_LLM: "true"
      NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
      LOG_LEVEL: INFO

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Prepare local configuration
        run: |
          mkdir -p data logs config
          cp config/user_profile.example.json config/user_profile.json

      - name: Run health check
        run: python scripts/health_check.py

      - name: Generate and email daily briefing
        run: python -m ai_observatory run --email

      - name: Upload logs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-briefing-logs-${{ github.run_id }}
          path: |
            logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload database artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: observatory-db-${{ github.run_id }}
          path: data/observatory.db
          if-no-files-found: ignore
          retention-days: 7
